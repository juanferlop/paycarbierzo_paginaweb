<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <!-- ========= Metadatos básicos ========= -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trabajos Realizados | Paycar Bierzo</title>
    <meta
      name="description"
      content="Selección de obras de Paycar Bierzo: estructuras de hormigón, obra civil y reformas ejecutadas en Ponferrada y la comarca del Bierzo."
    />
    <link rel="canonical" href="https://paycarbierzo.es/trabajos.html" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />

    <!-- ========= Tema oscuro/claro sin FOUC (aplica .dark antes de pintar) ========= -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          if (!pref) {
            pref = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.toggle('dark', pref === 'dark');
        } catch (_) {}
      })();
    </script>

    <!-- ========= Favicons / PWA ========= -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/assets/icons/safari-pinned-tab.svg"
      color="#f97316"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ========= Preloads críticos de FUENTES (coinciden con tus @font-face) ========= -->
    <link
      rel="preload"
      href="/assets/fonts/Inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Inter-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Montserrat-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ========= Preload del hero (mejora LCP) ========= -->
    <link
      rel="preload"
      as="image"
      href="assets/img/webp/cubicos-15-1280.webp"
      imagesrcset="
        assets/img/webp/cubicos-15-640.webp   640w,
        assets/img/webp/cubicos-15-1024.webp 1024w,
        assets/img/webp/cubicos-15-1280.webp 1280w,
        assets/img/webp/cubicos-15-1536.webp 1536w,
        assets/img/webp/cubicos-15-1920.webp 1920w
      "
      imagesizes="100vw"
    />

    <!-- ========= CSS (Tailwind COMPILADO + @font-face/@theme/@base) ========= -->
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <!-- ========= Librerías CSS de terceros ========= -->
    <!-- Choices -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    />
    <!-- GLightbox -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />

    <!-- ========= JSON-LD (BreadcrumbList) ========= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Inicio",
            "item": "https://paycarbierzo.es/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Trabajos Realizados",
            "item": "https://paycarbierzo.es/trabajos.html"
          }
        ]
      }
    </script>

    <!-- ========= Ajustes de estilo para Choices (modo oscuro) ========= -->
    <style>
      .dark .choices__inner {
        background-color: #111827;
        color: #e5e7eb;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        padding: 0.5rem;
      }
      .dark .choices__list--single .choices__item {
        color: #e5e7eb;
      }
      .dark .choices__placeholder {
        color: #94a3b8;
        opacity: 1;
      }
      .dark .choices__list--dropdown,
      .dark .choices__list[aria-expanded] {
        background-color: #0f172a;
        color: #e5e7eb;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }
      .dark .choices__list--dropdown .choices__item {
        background: transparent;
        color: #e5e7eb;
      }
      .dark .choices__list--dropdown .choices__item--selectable.is-highlighted {
        background-color: #334155;
        color: #f8fafc;
      }
      .dark .choices__item--disabled {
        color: #64748b;
      }
      .dark .choices__input--cloned {
        background-color: #0f172a;
        color: #e5e7eb;
        caret-color: #f59e0b;
      }
      .dark .choices[data-type*='select-one'] .choices__inner:after {
        border-color: #cbd5e1 transparent transparent;
      }
      .dark .choices[data-type*='select-one'].is-open .choices__inner:after {
        border-color: transparent transparent #cbd5e1;
      }
      .dark .is-open .choices__inner {
        border-color: #f59e0b;
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.35);
      }
    </style>
  </head>

  <body
    class="bg-gray-100 dark:bg-black text-gray-800 dark:text-gray-100 transition-colors duration-300"
  >
    <!-- Header -->
    <div id="header"></div>

    <!-- Hero: Trabajos realizados (SEO + rendimiento) -->
    <section
      class="relative w-full h-[500px] overflow-hidden"
      role="region"
      aria-labelledby="hero-trabajos-title"
    >
      <picture>
        <source
          type="image/avif"
          srcset="
            assets/img/webp/cubicos-15-640.avif   640w,
            assets/img/webp/cubicos-15-1024.avif 1024w,
            assets/img/webp/cubicos-15-1280.avif 1280w,
            assets/img/webp/cubicos-15-1536.avif 1536w,
            assets/img/webp/cubicos-15-1920.avif 1920w
          "
          sizes="100vw"
        />
        <source
          type="image/webp"
          srcset="
            assets/img/webp/cubicos-15-640.webp   640w,
            assets/img/webp/cubicos-15-1024.webp 1024w,
            assets/img/webp/cubicos-15-1280.webp 1280w,
            assets/img/webp/cubicos-15-1536.webp 1536w,
            assets/img/webp/cubicos-15-1920.webp 1920w
          "
          sizes="100vw"
        />
        <img
          src="assets/img/webp/cubicos-15-1280.webp"
          alt="Estructuras de hormigón — Paycar Bierzo"
          class="absolute inset-0 w-full h-full object-cover z-0"
          width="1920"
          height="1080"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <div class="absolute inset-0 bg-black/40 z-10" aria-hidden="true"></div>
      <div class="absolute inset-0 flex items-center justify-center z-20">
        <div class="text-center px-6 max-w-3xl">
          <h1
            id="hero-trabajos-title"
            class="text-4xl md:text-5xl font-extrabold text-white drop-shadow-lg"
          >
            Trabajos Realizados
          </h1>
          <p class="mt-4 text-lg md:text-xl text-gray-100">
            Seriedad, sencillez y profesionalidad en cada obra
          </p>
          <span class="mt-6 inline-block text-orange-500 font-bold text-xl"
            >Paycar Bierzo</span
          >
        </div>
      </div>
      <noscript>
        <img
          src="assets/img/webp/cubicos-15-1280.webp"
          alt="Estructuras de hormigón — Paycar Bierzo"
          class="w-full h-full object-cover"
          width="1920"
          height="1080"
        />
      </noscript>
    </section>

    <main>
      <!-- Sección: Trabajos Realizados (card redondeada) -->
      <section class="px-6 py-12 sm:py-16">
        <div class="mx-auto max-w-5xl">
          <div
            class="relative overflow-hidden rounded-3xl bg-white/90 dark:bg-gray-900/80 ring-1 ring-orange-100/70 dark:ring-orange-500/15 shadow-lg"
          >
            <div
              class="pointer-events-none absolute -top-16 -right-20 h-44 w-44 rounded-full bg-orange-200/30 blur-2xl"
            ></div>
            <div
              class="pointer-events-none absolute -bottom-14 -left-16 h-36 w-36 rounded-full bg-orange-100/40 dark:bg-orange-500/10 blur-xl"
            ></div>

            <div class="relative px-6 py-14 sm:px-12 sm:py-16 text-center">
              <p
                class="inline-flex items-center gap-2 rounded-full bg-orange-50 px-3 py-1 text-sm font-medium text-orange-700 ring-1 ring-orange-200 dark:bg-orange-500/10 dark:text-orange-300 dark:ring-orange-500/30"
              >
                Nuestros proyectos
              </p>
              <h2
                class="mt-4 text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-800 dark:text-white"
              >
                Trabajos Realizados
              </h2>
              <div class="mt-3 flex justify-center">
                <span
                  class="h-1 w-24 rounded-full bg-gradient-to-r from-orange-400 via-orange-300 to-orange-400 shadow-sm"
                ></span>
              </div>
              <p
                class="mx-auto mt-6 max-w-3xl text-lg leading-relaxed text-gray-600 dark:text-gray-300"
              >
                A lo largo del tiempo, hemos ejecutado numerosos proyectos en
                distintos puntos del Bierzo y más allá. Aquí puedes ver una
                selección de nuestras obras más recientes.
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Filtros -->
      <section class="max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6 mb-10">
          <div>
            <label for="filtro-fecha" class="sr-only">Ordenar por fecha</label>
            <select
              id="filtro-fecha"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="reciente">Más recientes</option>
              <option value="antigua">Más antiguas</option>
            </select>
          </div>
          <div>
            <label for="filtro-pueblo" class="sr-only"
              >Filtrar por pueblo</label
            >
            <select
              id="filtro-pueblo"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="">Todos los pueblos</option>
            </select>
          </div>
          <div>
            <label for="filtro-tipo" class="sr-only">Filtrar por tipo</label>
            <select
              id="filtro-tipo"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="">Todos los tipos</option>
            </select>
          </div>
        </div>

        <!-- Contenedor de proyectos -->
        <div
          id="contenedor-proyectos"
          class="grid gap-y-10 gap-x-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        ></div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Botón flotante modo claro/oscuro -->
    <button
      id="theme-toggle"
      data-ui-fab
      type="button"
      aria-label="Cambiar tema"
      aria-pressed="false"
      class="fixed bottom-6 right-6 z-50 inline-flex items-center justify-center rounded-full border shadow-lg p-3 bg-white/90 border-gray-200 text-gray-800 hover:scale-105 active:scale-95 transition dark:bg-gray-900/90 dark:border-gray-700 dark:text-gray-100"
    >
      <svg
        id="theme-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      ></svg>
    </button>

    <!-- ========= JS de terceros (defer) ========= -->
    <script
      src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"
      defer
    ></script>

    <!-- ========= JS propios (defer, no bloquean) ========= -->
    <script src="js/cargar-header.js" defer></script>
    <script src="js/cargar-footer.js" defer></script>
    <script src="js/fecha-footer.js" defer></script>
    <script src="js/theme-toggle.js" defer></script>
    <script src="js/menu-responsive.js" defer></script>
    <script src="js/proyectos-config.js?v=2026-07-28-1" defer></script>
    <script src="js/proyectos.js?v=2026-07-28-1" defer></script>
    <script src="js/comprobacion-email.js" defer></script>

    <!-- Consentimiento + inyección de GA tras aceptar -->
    <script
      src="/js/consent-analytics.js"
      defer
      data-ga-id="G-4R8T9VP3Y7"
    ></script>
  </body>
</html>
