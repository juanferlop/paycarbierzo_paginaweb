<!doctype html>
<html lang="es" class="dark">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-4R8T9VP3Y7"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-4R8T9VP3Y7');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabajos Realizados | Paycar Bierzo</title>
    <link rel="icon" type="image/webp" href="assets/img/webp/logo.webp" />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Choices -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"
      defer
    ></script>
    <!-- GLightbox -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />
    <!-- 1) Fijar tema antes de pintar nada 
    antes de que cargue Tailwind CSS para evitar el “flash” de color al iniciar-->
    <script src="js/theme-init.js"></script>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2) Config de Tailwind para CDN -->
    <script>
      // Coloca este bloque en <head>, ANTES del CDN
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
      };
    </script>

    <!-- BreadcrumbList (migas de pan) en JSON-LD ayuda a Google a entender la jerarquía de tu sitio. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Inicio",
            "item": "https://paycarbierzo.es/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Trabajos Realizados",
            "item": "https://paycarbierzo.es/trabajos.html"
          }
        ]
      }
    </script>
    <!-- INICIO ETIQUETAS FAVICON -->
    <!-- Favicon básico -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />

    <!-- iOS (anclado a pantalla de inicio) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Safari pinned tab (opcional si tienes SVG monocromo) -->
    <link
      rel="mask-icon"
      href="/assets/icons/safari-pinned-tab.svg"
      color="#f97316"
    />

    <!-- Colores del navegador (opcional) -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- FIN ETIQUETAS FAVICON -->
    <!-- Estilos personalizados para Choices.js (para las tarjetas y los filtros de los proectos) -->
    <style>
      /* ===== Choices – Modo oscuro pulido ===== */

      /* Caja del select (cerrado) */
      .dark .choices__inner {
        background-color: #111827; /* gray-900 */
        color: #e5e7eb; /* gray-200 */
        border: 1px solid #374151; /* gray-700 */
        border-radius: 0.5rem; /* rounded */
        padding: 0.5rem; /* p-2 */
      }

      /* Texto seleccionado / placeholder dentro de la caja */
      .dark .choices__list--single .choices__item {
        color: #e5e7eb;
      }
      .dark .choices__placeholder {
        color: #94a3b8;
        opacity: 1;
      } /* slate-400 */

      /* Dropdown (lista abierta) */
      .dark .choices__list--dropdown,
      .dark .choices__list[aria-expanded] {
        background-color: #0f172a; /* slate-900 */
        color: #e5e7eb;
        border: 1px solid #374151; /* gray-700 */
        border-radius: 0.5rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      }

      /* Fila base de opción (evita fondos blancos) */
      .dark .choices__list--dropdown .choices__item {
        background: transparent;
        color: #e5e7eb;
      }

      /* Estado hover/teclado sobre opción */
      .dark .choices__list--dropdown .choices__item--selectable.is-highlighted {
        background-color: #334155; /* slate-700 */
        color: #f8fafc; /* slate-50 */
      }

      /* Opción deshabilitada */
      .dark .choices__item--disabled {
        color: #64748b;
      } /* slate-500 */

      /* Input de búsqueda (en el select de pueblos) */
      .dark .choices__input--cloned {
        background-color: #0f172a;
        color: #e5e7eb;
        caret-color: #f59e0b; /* amber-500, tu acento */
      }

      /* Flecha del select-one (solo recolor; el tamaño/posicion lo aporta tu CSS actual) */
      .dark .choices[data-type*='select-one'] .choices__inner:after {
        border-color: #cbd5e1 transparent transparent; /* slate-300 */
      }
      .dark .choices[data-type*='select-one'].is-open .choices__inner:after {
        border-color: transparent transparent #cbd5e1;
      }

      /* Borde/foco cuando está abierto (leve acento naranja) */
      .dark .is-open .choices__inner {
        border-color: #f59e0b; /* amber-500 */
        box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.35);
      }
    </style>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-gray-100 dark:bg-black text-gray-800 dark:text-gray-100 transition-colors duration-300"
  >
    <!-- Header -->
    <div id="header"></div>

    <!-- Hero: Trabajos realizados -->
    <section class="relative w-full h-[500px] overflow-hidden">
      <img
        src="assets/img/webp/cubicos-15.webp"
        alt="Estructuras de hormigón - Paycar Bierzo"
        class="absolute inset-0 w-full h-full object-cover z-0"
        width="1920"
        height="1080"
        loading="eager"
        fetchpriority="high"
      />

      <!-- Overlay oscuro -->
      <div class="absolute inset-0 bg-black/40 z-10"></div>

      <!-- Texto centrado -->
      <div class="absolute inset-0 flex items-center justify-center z-20">
        <div class="text-center px-6">
          <h1
            class="text-4xl md:text-4xl font-extrabold text-white drop-shadow-lg"
            style="font-family: 'Montserrat', sans-serif"
          >
            Trabajos Realizados
          </h1>
          <p
            class="mt-4 text-lg md:text-xl text-gray-100"
            style="font-family: 'Inter', sans-serif"
          >
            Seriedad, sencillez y profesionalidad en cada obra
          </p>
          <span
            class="mt-6 inline-block text-orange-500 font-bold text-xl"
            style="font-family: 'Montserrat', sans-serif"
          >
            Paycar Bierzo
          </span>
        </div>
      </div>
    </section>

    <main>
      <!-- Sección: Trabajos Realizados (card redondeada) -->
      <section class="px-6 py-12 sm:py-16">
        <div class="mx-auto max-w-5xl">
          <!-- Card redondeada -->
          <div
            class="relative overflow-hidden rounded-3xl bg-white/90 dark:bg-gray-900/80 ring-1 ring-orange-100/70 dark:ring-orange-500/15 shadow-lg"
          >
            <!-- Luces suaves (decoración muy sutil) -->
            <div
              class="pointer-events-none absolute -top-16 -right-20 h-44 w-44 rounded-full bg-orange-200/30 blur-2xl"
            ></div>
            <div
              class="pointer-events-none absolute -bottom-14 -left-16 h-36 w-36 rounded-full bg-orange-100/40 dark:bg-orange-500/10 blur-xl"
            ></div>

            <!-- Contenido -->
            <div class="relative px-6 py-14 sm:px-12 sm:py-16 text-center">
              <!-- Eyebrow / píldora -->
              <p
                class="inline-flex items-center gap-2 rounded-full bg-orange-50 px-3 py-1 text-sm font-medium text-orange-700 ring-1 ring-orange-200 dark:bg-orange-500/10 dark:text-orange-300 dark:ring-orange-500/30"
              >
                Nuestros proyectos
              </p>

              <!-- Título -->
              <h2
                class="mt-4 text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-800 dark:text-white"
              >
                Trabajos Realizados
              </h2>

              <!-- subrayado decorativo centrado -->
              <div class="mt-3 flex justify-center">
                <span
                  class="h-1 w-24 rounded-full bg-gradient-to-r from-orange-400 via-orange-300 to-orange-400 shadow-sm"
                ></span>
              </div>

              <!-- Descripción -->
              <p
                class="mx-auto mt-6 max-w-3xl text-lg leading-relaxed text-gray-600 dark:text-gray-300"
              >
                A lo largo del tiempo, hemos ejecutado numerosos proyectos en
                distintos puntos del Bierzo y más allá. Aquí puedes ver una
                selección de nuestras obras más recientes.
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="max-w-7xl mx-auto px-4">
        <!-- Filtros con tarjeta -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-6 mb-10">
          <div>
            <label for="filtro-fecha" class="sr-only">Ordenar por fecha</label>
            <select
              id="filtro-fecha"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="reciente">Más recientes</option>
              <option value="antigua">Más antiguas</option>
            </select>
          </div>

          <div>
            <label for="filtro-pueblo" class="sr-only"
              >Filtrar por pueblo</label
            >
            <select
              id="filtro-pueblo"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="">Todos los pueblos</option>
            </select>
          </div>

          <div>
            <label for="filtro-tipo" class="sr-only">Filtrar por tipo</label>
            <select
              id="filtro-tipo"
              class="w-full border rounded p-2 dark:bg-gray-800 dark:text-gray-200"
            >
              <option value="">Todos los tipos</option>
            </select>
          </div>
        </div>

        <!-- Contenedor de proyectos -->
        <div
          id="contenedor-proyectos"
          class="grid gap-y-10 gap-x-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
        ></div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Datos + galería -->
    <script src="js/proyectos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

    <!-- Botón flotante modo claro/oscuro -->
    <button
      id="theme-toggle"
      type="button"
      aria-label="Cambiar tema"
      aria-pressed="false"
      class="fixed bottom-6 right-6 z-50 inline-flex items-center justify-center rounded-full border shadow-lg p-3 bg-white/90 border-gray-200 text-gray-800 hover:scale-105 active:scale-95 transition dark:bg-gray-900/90 dark:border-gray-700 dark:text-gray-100"
    >
      <svg
        id="theme-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </button>

    <!-- Scripts de carga -->
    <script src="js/cargar-header.js"></script>
    <script src="js/cargar-footer.js"></script>
    <script src="js/fecha-footer.js"></script>
    <script src="js/theme-toggle.js" defer></script>
    <script src="js/menu-responsive.js"></script>
    <script src="js/proyectos.js"></script>
    <script src="js/comprobacion-email.js" defer></script>
  </body>
</html>
