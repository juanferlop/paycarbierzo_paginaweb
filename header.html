<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paycar Bierzo - Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .services-dropdown {
        opacity: 0;
        visibility: hidden;
        transform: translateY(10px);
        transition: all 0.3s ease;
      }
      .services-menu:hover .services-dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      /* Asegurar que el dropdown no se corte */
      .header-container {
        position: relative;
        z-index: 100;
      }
      /* Mejorar la visualización en móviles */
      @media (max-width: 767px) {
        #menu {
          max-height: 0;
          overflow: hidden;
          transition: max-height 0.5s ease;
        }
        #menu.mobile-open {
          max-height: 500px;
        }
        .services-dropdown {
          position: static;
          opacity: 1;
          visibility: visible;
          transform: none;
          margin-left: 1rem;
          margin-top: 0.5rem;
          display: none;
        }
        .services-dropdown.mobile-open {
          display: block;
        }
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <!-- Top bar (desktop only) -->
    <div
      class="hidden md:block border-b border-gray-200 dark:border-gray-800 bg-white/90 dark:bg-gray-900/90 backdrop-blur"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <div
          class="h-10 flex items-center justify-between text-sm text-gray-600 dark:text-gray-300"
        >
          <!-- Izquierda: Teléfono + Email -->
          <div class="flex items-center gap-6">
            <a
              href="tel:+34619761685"
              class="inline-flex items-center gap-2 font-medium hover:text-orange-600 transition-colors"
              aria-label="Llamar al 619 761 685"
            >
              <!-- icono teléfono -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 5a2 2 0 012-2h1.28a2 2 0 011.94 1.515l.6 2.399a2 2 0 01-.55 1.944l-1.02 1.02a16 16 0 006.364 6.364l1.02-1.02a2 2 0 011.944-.55l2.399.6A2 2 0 0121 19.72V21a2 2 0 01-2 2h-1C8.82 23 1 15.18 1 6V5a2 2 0 012-2z"
                />
              </svg>
              <span>619 761 685</span>
            </a>

            <a
              href="mailto:carlosfernandez_pyc@hotmail.com"
              class="inline-flex items-center gap-2 hover:text-orange-600 transition-colors"
              aria-label="Enviar correo a carlosfernandez_pyc@hotmail.com"
            >
              <!-- icono email -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
              <span class="truncate">carlosfernandez_pyc@hotmail.com</span>
            </a>
          </div>

          <!-- Derecha: Ubicación + Horario -->
          <div class="flex items-center gap-6">
            <a
              href="https://maps.google.com/?q=Dehesas+León"
              target="_blank"
              rel="noopener"
              class="inline-flex items-center gap-1 hover:text-orange-600 transition-colors"
              aria-label="Abrir ubicación en Google Maps"
            >
              <!-- icono ubicación -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 11c1.657 0 3-1.343 3-3S13.657 5 12 5 9 6.343 9 8s1.343 3 3 3z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 22s8-4.5 8-12a8 8 0 10-16 0c0 7.5 8 12 8 12z"
                />
              </svg>
              <span>Dehesas (León)</span>
            </a>

            <span class="flex items-center gap-1">
              <!-- icono reloj -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              Lun–Vie 9:00–19:00
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Header -->
    <header class="bg-white dark:bg-gray-900 shadow-md header-container">
      <div class="w-full px-4 md:px-8 py-4 flex justify-between items-center">
        <!-- Marca (logo + título). Si clickas en el logo te lleva a inicio. -->
        <a
          href="/index.html"
          class="group inline-flex items-center gap-3 rounded-lg px-1 py-1 transition-transform duration-150 ease-out hover:-translate-y-0.5 focus-visible:-translate-y-0.5 active:-translate-y-0.5 focus:outline-none focus-visible:ring-1 focus-visible:ring-neutral-400/40 focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-900"
          aria-label="Ir a inicio"
        >
          <img
            src="/assets/img/webp/logo.webp"
            alt="Logo Paycar Bierzo"
            class="h-10 w-auto transition-transform duration-150 ease-out group-hover:-translate-y-0.5 group-focus-visible:-translate-y-0.5 group-active:-translate-y-0.5 motion-reduce:transition-none motion-reduce:transform-none"
          />

          <span
            class="relative whitespace-nowrap text-xl md:text-2xl font-semibold tracking-tight"
          >
            Paycar Bierzo S.L.
            <!-- Subrayado 100%: aparece por opacidad (funciona perfecto en móvil y escritorio) -->
            <span
              aria-hidden="true"
              class="pointer-events-none absolute left-0 -bottom-1 h-px w-full bg-orange-500/60 opacity-0 transition-opacity duration-150 ease-out group-hover:opacity-100 group-focus:opacity-100 group-focus-visible:opacity-100 group-active:opacity-100"
            ></span>
          </span>
        </a>

        <!-- Botón hamburguesa (móvil) -->
        <button
          id="menu-btn"
          class="md:hidden text-2xl focus:outline-none"
          aria-label="Abrir menú"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>

        <!-- Navegación desktop -->
        <nav
          id="menu"
          class="hidden md:flex flex-col md:flex-row md:space-x-4 absolute md:static top-full left-0 w-full md:w-auto bg-white dark:bg-gray-900 md:bg-transparent shadow-md md:shadow-none z-50"
        >
          <a
            href="/index.html"
            class="block px-4 py-2 hover:text-orange-500 transition-colors"
            >Inicio</a
          >

          <a
            href="/sobre-nosotros.html"
            class="block px-4 py-2 hover:text-orange-500 transition-colors"
            >Sobre Nosotros</a
          >

          <!-- Sección Servicios con submenú -->
          <div class="services-menu relative">
            <a
              href="#"
              class="block px-4 py-2 hover:text-orange-500 transition-colors flex items-center"
            >
              Servicios
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4 ml-1"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </a>
            <div
              class="services-dropdown absolute left-0 top-full mt-1 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg z-50 border border-gray-200 dark:border-gray-700"
            >
              <a
                href="/empresa-construccion-el-bierzo/index.html"
                class="block px-4 py-2 text-gray-800 dark:text-white hover:bg-orange-500 hover:text-white transition-colors rounded-t-md"
                >El Bierzo</a
              >
              <a
                href="/empresa-construccion-ponferrada/index.html"
                class="block px-4 py-2 text-gray-800 dark:text-white hover:bg-orange-500 hover:text-white transition-colors rounded-b-md"
                >Ponferrada</a
              >
            </div>
          </div>
          <a
            href="/trabajos.html"
            class="block px-4 py-2 hover:text-orange-500 transition-colors"
            >Trabajos Realizados</a
          >
          <a
            href="/contacto.html"
            class="block px-4 py-2 hover:text-orange-500 transition-colors"
            >Contacto</a
          >
        </nav>
      </div>
    </header>
  </body>
</html>
