<!doctype html>
<html lang="es" class="dark">
  <head>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-4R8T9VP3Y7"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-4R8T9VP3Y7');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto | Paycar Bierzo</title>
    <link rel="icon" type="image/webp" href="assets/img/webp/logo.webp" />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <!-- 1) Fijar tema antes de pintar nada 
    antes de que cargue Tailwind CSS para evitar el “flash” de color al iniciar-->
    <script src="js/theme-init.js"></script>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2) Config de Tailwind para CDN -->
    <script>
      // Coloca este bloque en <head>, ANTES del CDN
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
      };
    </script>

    <!-- BreadcrumbList (migas de pan) en JSON-LD ayuda a Google a entender la jerarquía de tu sitio. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Inicio",
            "item": "https://paycarbierzo.es/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Contacto",
            "item": "https://paycarbierzo.es/contacto.html"
          }
        ]
      }
    </script>
    <!-- INICIO ETIQUETAS FAVICON -->
    <!-- Favicon básico -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />

    <!-- iOS (anclado a pantalla de inicio) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />

    <!-- Android / PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Safari pinned tab (opcional si tienes SVG monocromo) -->
    <link
      rel="mask-icon"
      href="/assets/icons/safari-pinned-tab.svg"
      color="#f97316"
    />

    <!-- Colores del navegador (opcional) -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- FIN ETIQUETAS FAVICON -->

    <!-- Preload de la 1º imágen del carrusel (hero) -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/webp/cubicos-4-1280.webp"
      imagesrcset="/assets/img/webp/cubicos-4-1024.webp 1024w, /assets/img/webp/cubicos-4-1280.webp 1280w, /assets/img/webp/cubicos-4-1920.webp 1920w"
      imagesizes="100vw"
    />
  </head>

  <body
    class="bg-gray-100 dark:bg-black text-gray-800 dark:text-gray-100 transition-colors duration-300"
  >
    <!-- Header -->
    <div id="header"></div>

    <!-- Carrusel (SEO + rendimiento) -->
    <section
      class="w-full mt-8"
      role="region"
      aria-labelledby="carrusel-contacto-title"
    >
      <h2 id="carrusel-contacto-title" class="sr-only">
        Galería de obras — Paycar Bierzo
      </h2>

      <figure
        class="relative w-full h-[400px] overflow-hidden rounded-xl shadow"
      >
        <!-- ✅ IDs que el JS necesita -->
        <picture id="cc-picture" class="absolute inset-0">
          <source id="cc-avif" type="image/avif" sizes="100vw" />
          <source id="cc-webp" type="image/webp" sizes="100vw" />
          <img
            id="cc-img"
            src="/assets/img/webp/cubicos-4-1280.webp"
            alt="Obra de encofrado y estructura de hormigón"
            class="w-full h-full object-cover transition-opacity duration-500 opacity-100"
            width="1920"
            height="1080"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
          />
        </picture>

        <figcaption id="cc-caption" class="sr-only">
          Obras recientes de estructuras de hormigón realizadas por Paycar
          Bierzo.
        </figcaption>
      </figure>
    </section>

    <!-- Sección de Contacto -->
    <section id="contacto" class="bg-white dark:bg-gray-800 py-16 mt-8">
      <div class="max-w-7xl mx-auto px-6 text-center">
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-4">
          Contáctanos
        </h2>
        <p class="text-gray-600 dark:text-gray-300 mb-12">
          Estamos a tu disposición para ayudarte en lo que necesites.
        </p>

        <div class="grid md:grid-cols-3 gap-8 text-left">
          <!-- Teléfono -->
          <a
            href="tel:+34619761685"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-phone-alt mr-2" aria-hidden="true"></i> Teléfono
            </div>
            <p class="text-gray-700 dark:text-gray-200 text-base">
              +34 619 76 16 85
            </p>
          </a>

          <!-- Dirección -->
          <a
            href="https://www.google.com/maps?q=Dehesas,+Ponferrada,+León"
            target="_blank"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-map-marker-alt mr-2" aria-hidden="true"></i>
              Ubicación
            </div>
            <p class="text-gray-700 dark:text-gray-200 text-base">
              Dehesas, Ponferrada (León)
            </p>
          </a>

          <!-- Correo -->
          <a
            id="correo-enlace"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline hover:text-blue-700 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            data-email
            data-user="carlosfernandez_pyc"
            data-domain="hotmail.com"
            data-label="Enviar correo a"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-envelope mr-2" aria-hidden="true"></i> Correo
              Electrónico
            </div>
            <p
              id="correo-texto"
              class="text-gray-700 dark:text-gray-200 text-base break-all"
              data-email-text
            >
              Escríbenos por email
            </p>
          </a>

          <noscript
            ><p class="text-sm">
              carlosfernandez_pyc [at] hotmail.com
            </p></noscript
          >
        </div>
      </div>
    </section>

    <!-- Footer unificado -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script></script>

    <!-- Botón flotante modo claro/oscuro -->
    <button
      id="theme-toggle"
      type="button"
      aria-label="Cambiar tema"
      aria-pressed="false"
      class="fixed bottom-6 right-6 z-50 inline-flex items-center justify-center rounded-full border shadow-lg p-3 bg-white/90 border-gray-200 text-gray-800 hover:scale-105 active:scale-95 transition dark:bg-gray-900/90 dark:border-gray-700 dark:text-gray-100"
    >
      <svg
        id="theme-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      ></svg>
    </button>

    <!-- Scripts de carga -->
    <script src="js/cargar-header.js"></script>
    <script src="js/cargar-footer.js"></script>
    <script src="js/fecha-footer.js"></script>
    <script src="js/theme-toggle.js" defer></script>
    <script src="js/menu-responsive.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/carrusel-contacto.js"></script>
    <script src="js/comprobacion-email.js" defer></script>
  </body>
</html>
