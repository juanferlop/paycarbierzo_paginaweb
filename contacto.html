<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <!-- ========= Metadatos básicos ========= -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contacto | Paycar Bierzo</title>
    <meta
      name="description"
      content="Contacta con Paycar Bierzo: teléfono, correo y ubicación en Dehesas (Ponferrada, León). Te ayudamos con tu obra y estructuras de hormigón."
    />
    <link rel="canonical" href="https://paycarbierzo.es/contacto.html" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Fijar tema antes de pintar (evita flash) -->
    <script>
      (function () {
        try {
          var ls = localStorage.getItem('theme');
          var mql = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (ls === 'dark' || (!ls && mql))
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- ========= Favicons / PWA ========= -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/assets/icons/safari-pinned-tab.svg"
      color="#f97316"
    />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ========= Preloads críticos de FUENTES (coinciden con tus @font-face) ========= -->
    <link
      rel="preload"
      href="/assets/fonts/Inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Inter-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/Montserrat-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ========= Preload de la 1ª imagen del carrusel (mejora LCP) ========= -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/webp/cubicos-4-1280.webp"
      imagesrcset="/assets/img/webp/cubicos-4-1024.webp 1024w, /assets/img/webp/cubicos-4-1280.webp 1280w, /assets/img/webp/cubicos-4-1920.webp 1920w"
      imagesizes="100vw"
    />

    <!-- ========= CSS (Tailwind COMPILADO + @font-face/@theme/@base) ========= -->
    <link rel="stylesheet" href="/assets/css/styles.css" />

    <!-- ========= CSS de terceros que usas (iconos + swiper) ========= -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- ========= JSON-LD BreadcrumbList ========= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Inicio",
            "item": "https://paycarbierzo.es/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Contacto",
            "item": "https://paycarbierzo.es/contacto.html"
          }
        ]
      }
    </script>
  </head>

  <body
    class="bg-gray-100 dark:bg-black text-gray-800 dark:text-gray-100 transition-colors duration-300"
  >
    <!-- Header (inyectado por fetch) -->
    <div id="header"></div>

    <!-- Carrusel (mantengo IDs usados por tu JS) -->
    <section
      class="w-full mt-8"
      role="region"
      aria-labelledby="carrusel-contacto-title"
      tabindex="0"
    >
      <h2 id="carrusel-contacto-title" class="sr-only">
        Galería de obras — Paycar Bierzo
      </h2>
      <figure
        class="relative w-full h-[400px] overflow-hidden rounded-xl shadow"
      >
        <picture id="cc-picture" class="absolute inset-0">
          <source id="cc-avif" type="image/avif" sizes="100vw" />
          <source id="cc-webp" type="image/webp" sizes="100vw" />
          <img
            id="cc-img"
            src="/assets/img/webp/cubicos-4-1280.webp"
            alt="Obra de encofrado y estructura de hormigón"
            class="w-full h-full object-cover transition-opacity duration-500 opacity-100"
            width="1920"
            height="1080"
            loading="lazy"
            decoding="async"
            fetchpriority="low"
          />
        </picture>
        <!-- Flechas laterales (sin bullets) -->
        <div
          class="absolute inset-0 flex items-center justify-between px-2 md:px-4 opacity-100 md:opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition pointer-events-none"
        >
          <button
            id="cc-prev"
            type="button"
            aria-label="Imagen anterior"
            class="pointer-events-auto inline-flex items-center justify-center h-10 w-10 md:h-12 md:w-12 rounded-full bg-white/85 dark:bg-gray-900/85 backdrop-blur border border-gray-200 dark:border-gray-700 shadow hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-400"
          >
            <!-- icono flecha izquierda -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
          </button>

          <button
            id="cc-next"
            type="button"
            aria-label="Imagen siguiente"
            class="pointer-events-auto inline-flex items-center justify-center h-10 w-10 md:h-12 md:w-12 rounded-full bg-white/85 dark:bg-gray-900/85 backdrop-blur border border-gray-200 dark:border-gray-700 shadow hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-orange-400"
          >
            <!-- icono flecha derecha -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
            >
              <path d="M8.59 16.59 13.17 12 8.59 7.41 10 6l6 6-6 6z" />
            </svg>
          </button>
        </div>

        <figcaption id="cc-caption" class="sr-only">
          Obras recientes de estructuras de hormigón realizadas por Paycar
          Bierzo.
        </figcaption>
      </figure>
    </section>

    <!-- Sección de Contacto (contenido intacto) -->
    <section id="contacto" class="bg-white dark:bg-gray-800 py-16 mt-8">
      <div class="max-w-7xl mx-auto px-6 text-center">
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-4">
          Contáctanos
        </h2>
        <p class="text-gray-600 dark:text-gray-300 mb-12">
          Estamos a tu disposición para ayudarte en lo que necesites.
        </p>

        <div class="grid md:grid-cols-3 gap-8 text-left">
          <!-- Teléfono -->
          <a
            href="tel:+34619761685"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-phone-alt mr-2" aria-hidden="true"></i> Teléfono
            </div>
            <p class="text-gray-700 dark:text-gray-200 text-base">
              +34 619 76 16 85
            </p>
          </a>

          <!-- Dirección -->
          <a
            href="https://www.google.com/maps?q=Dehesas,+Ponferrada,+León"
            target="_blank"
            rel="noopener"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-map-marker-alt mr-2" aria-hidden="true"></i>
              Ubicación
            </div>
            <p class="text-gray-700 dark:text-gray-200 text-base">
              Dehesas, Ponferrada (León)
            </p>
          </a>

          <!-- Correo (obfuscado por JS) -->
          <a
            id="correo-enlace"
            class="block bg-gray-100 dark:bg-gray-700 p-6 rounded-xl shadow hover:shadow-xl hover:scale-105 transform transition duration-300 no-underline hover:text-blue-700 dark:hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
            data-email
            data-user="carlosfernandez_pyc"
            data-domain="hotmail.com"
            data-label="Enviar correo a"
          >
            <div
              class="flex items-center mb-2 text-blue-600 dark:text-blue-400 text-xl font-semibold"
            >
              <i class="fas fa-envelope mr-2" aria-hidden="true"></i> Correo
              Electrónico
            </div>
            <p
              id="correo-texto"
              class="text-gray-700 dark:text-gray-200 text-base break-all"
              data-email-text
            >
              Escríbenos por email
            </p>
          </a>

          <noscript
            ><p class="text-sm">
              carlosfernandez_pyc [at] hotmail.com
            </p></noscript
          >
        </div>
      </div>
    </section>

    <!-- Footer (inyectado por fetch) -->
    <div id="footer"></div>

    <!-- Botón claro/oscuro (IDs correctos) -->
    <button
      id="theme-toggle"
      data-ui-fab
      type="button"
      aria-label="Cambiar tema"
      aria-pressed="false"
      class="fixed bottom-6 right-6 z-50 inline-flex items-center justify-center rounded-full border shadow-lg p-3 bg-white/90 border-gray-200 text-gray-800 hover:scale-105 active:scale-95 transition dark:bg-gray-900/90 dark:border-gray-700 dark:text-gray-100"
    >
      <svg
        id="theme-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        width="20"
        height="20"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      ></svg>
    </button>

    <!-- ========= Scripts (defer, no bloquean) ========= -->
    <script src="/js/cargar-header.js" defer></script>
    <script src="/js/cargar-footer.js" defer></script>
    <script src="/js/fecha-footer.js" defer></script>
    <script src="/js/theme-toggle.js" defer></script>
    <!-- Ruta ABSOLUTA -->
    <script src="/js/menu-responsive.js" defer></script>

    <!-- Swiper (si lo usa tu carrusel) -->
    <script
      src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
      defer
    ></script>

    <!-- Tu carrusel (mantengo nombre/IDs) -->
    <script src="/js/carrusel-contacto.js" defer></script>

    <!-- Email obfuscation -->
    <script src="/js/comprobacion-email.js" defer></script>

    <!-- Consentimiento + GA tras aceptar -->
    <script
      src="/js/consent-analytics.js"
      defer
      data-ga-id="G-4R8T9VP3Y7"
    ></script>
  </body>
</html>
